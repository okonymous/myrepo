<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InvoicePro — Invoice & Penawaran</title><style>:root{font-family:system-ui,Arial;color:#eaf1ff;background:#0b1220}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:auto;padding:28px 18px}h1{margin:0;font-size:38px}p{color:#aebed5}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #36445e;border-radius:18px;background:#162338;padding:22px;margin-top:18px}label{display:block;font-size:13px;color:#bdc9da;margin-top:11px}input,textarea,select{width:100%;padding:10px;background:#0b1629;border:1px solid #405473;color:white;border-radius:9px;font:inherit}textarea{min-height:65px}button{border:0;border-radius:10px;padding:11px 16px;background:#7779f4;color:white;font-weight:650;cursor:pointer;margin:4px 3px 4px 0}button.secondary{background:#2c425f}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.item{border-bottom:1px solid #35455e;padding-bottom:12px;margin-bottom:10px}#preview{background:white;color:#17233a;border-radius:12px;padding:25px;min-height:500px;overflow-wrap:anywhere}#preview h2{margin:0}#preview .muted{color:#59697f}table{border-collapse:collapse;width:100%}th,td{padding:8px;text-align:left;border-bottom:1px solid #c6cedb;font-size:13px}td.num,th.num{text-align:right}#preview .totals{max-width:290px;margin-left:auto;margin-top:20px}.totals div{display:flex;justify-content:space-between;gap:20px;padding:6px}.totals div:last-child{font-size:19px;font-weight:750;border-top:2px solid #18233a}.status{min-height:24px;color:#b4f6ca}footer{padding:26px;color:#98a8bf}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media print{body{background:white}header,.edit,footer,#status{display:none!important}main{padding:0;max-width:100%}.layout{display:block}.panel{background:white;border:0;padding:0;margin:0}#preview{padding:10px;min-height:0}@page{size:A4;margin:12mm}}</style></head><body><main><header><h1>InvoicePro</h1><p>Buat invoice dan quotation profesional. Cetak atau simpan PDF langsung dari browser.</p></header><div class="layout"><section class="panel edit"><h2>Editor dokumen</h2><div class="two"><div><label>Jenis dokumen</label><select id="kind"><option value="Invoice">Invoice</option><option value="Quotation">Quotation / Penawaran</option><option value="Kwitansi">Kwitansi</option></select></div><div><label>Nomor dokumen</label><input id="number" value="INV-001"></div></div><div class="two"><div><label>Tanggal</label><input type="date" id="date"></div><div><label>Jatuh tempo / Berlaku hingga</label><input type="date" id="due"></div></div><label>Nama perusahaan Anda</label><input id="seller" placeholder="PT Contoh Indonesia"><label>Alamat / kontak perusahaan</label><textarea id="sellerInfo" placeholder="Alamat, telepon, email"></textarea><label>Nama pelanggan</label><input id="customer" placeholder="PT Pelanggan"><label>Alamat / kontak pelanggan</label><textarea id="customerInfo"></textarea><h3>Item produk / jasa</h3><div id="items"></div><button id="add" class="secondary">+ Tambah item</button><div class="two"><div><label>Diskon (%)</label><input id="discount" type="number" min="0" max="100" value="0"></div><div><label>Pajak (%)</label><input id="tax" type="number" min="0" max="100" value="0"></div></div><label>Status pembayaran</label><select id="payment"><option>Belum dibayar</option><option>Sudah dibayar</option><option>Dibayar sebagian</option></select><label>Catatan / informasi pembayaran</label><textarea id="notes" placeholder="Bank dan nomor rekening, syarat pembayaran, dll."></textarea><div><button id="save">Simpan draft</button><button id="load" class="secondary">Muat draft</button><button id="clear" class="secondary">Reset</button></div><p id="status" class="status" role="status"></p></section><section class="panel"><div class="edit"><h2>Preview</h2><button id="print">Cetak / Simpan PDF</button><button id="download" class="secondary">Unduh HTML</button></div><div id="preview"></div></section></div><footer>InvoicePro v1 • Draft disimpan di browser perangkat Anda, tidak di server. Ini bukan faktur pajak atau tanda tangan elektronik tersertifikasi.</footer></main><script>
const $=x=>document.getElementById(x), ids=['kind','number','date','due','seller','sellerInfo','customer','customerInfo','discount','tax','payment','notes'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]||'&#39;'));
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);
let items=[{name:'Jasa konsultasi',qty:1,price:1000000}];
const today=new Date();$('date').value=today.toISOString().slice(0,10);let later=new Date(today.getTime()+14*86400000);$('due').value=later.toISOString().slice(0,10);
function itemControls(){ $('items').innerHTML=items.map((it,i)=>'<div class="item"><div class="three"><div><label>Deskripsi</label><input data-i="'+i+'" data-key="name" value="'+esc(it.name)+'"></div><div><label>Jumlah</label><input type="number" min="0" step=".01" data-i="'+i+'" data-key="qty" value="'+it.qty+'"></div><div><label>Harga</label><input type="number" min="0" step="1" data-i="'+i+'" data-key="price" value="'+it.price+'"></div></div><button class="secondary" data-remove="'+i+'">Hapus</button></div>').join('');$('items').querySelectorAll('[data-i]').forEach(e=>e.addEventListener('input',()=>{let i=+e.dataset.i,k=e.dataset.key;items[i][k]=k==='name'?e.value:Math.max(0,Number(e.value)||0);render()}));$('items').querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{items.splice(+e.dataset.remove,1);itemControls();render()})}
function render(){let subtotal=items.reduce((a,i)=>a+Number(i.qty)*Number(i.price),0),discount=Math.min(100,Math.max(0,Number($('discount').value)||0)),tax=Math.min(100,Math.max(0,Number($('tax').value)||0));let after=subtotal*(1-discount/100),taxVal=after*tax/100,total=after+taxVal;const v=id=>esc($(id).value).replace(/\n/g,'<br>');$('preview').innerHTML='<div style="display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap"><div><h2>'+v('kind').toUpperCase()+'</h2><p class="muted">#'+v('number')+'</p></div><div style="text-align:right"><strong>'+v('seller')+'</strong><div class="muted">'+v('sellerInfo')+'</div></div></div><hr><div style="display:flex;justify-content:space-between;gap:12px"><div><small>Ditujukan kepada:</small><p><b>'+v('customer')+'</b><br>'+v('customerInfo')+'</p></div><div><small>Tanggal: '+v('date')+'<br>Jatuh tempo / Berlaku: '+v('due')+'</small></div></div><table><thead><tr><th>Deskripsi</th><th class="num">Qty</th><th class="num">Harga</th><th class="num">Total</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="num">'+esc(x.qty)+'</td><td class="num">'+money(x.price)+'</td><td class="num">'+money(x.qty*x.price)+'</td></tr>').join('')+'</tbody></table><div class="totals"><div><span>Subtotal</span><span>'+money(subtotal)+'</span></div><div><span>Diskon '+discount+'%</span><span>−'+money(subtotal*discount/100)+'</span></div><div><span>Pajak '+tax+'%</span><span>'+money(taxVal)+'</span></div><div><span>Total</span><span>'+money(total)+'</span></div></div><p><b>Status:</b> '+v('payment')+'</p><p style="white-space:pre-wrap">'+v('notes')+'</p>'}
$('add').onclick=()=>{items.push({name:'',qty:1,price:0});itemControls();render()};ids.forEach(id=>$(id).addEventListener('input',render));$('print').onclick=()=>window.print();$('save').onclick=()=>{localStorage.setItem('invoicepro-draft',JSON.stringify({fields:Object.fromEntries(ids.map(id=>[id,$(id).value])),items}));$('status').textContent='Draft tersimpan di browser ini.'};$('load').onclick=()=>{try{let x=JSON.parse(localStorage.getItem('invoicepro-draft'));if(!x)throw Error('Belum ada draft');ids.forEach(id=>{if(x.fields[id]!==undefined)$(id).value=x.fields[id]});items=x.items;itemControls();render();$('status').textContent='Draft dimuat.'}catch(e){$('status').textContent=e.message}};$('clear').onclick=()=>{if(confirm('Reset dokumen?')){localStorage.removeItem('invoicepro-draft');location.reload()}};$('download').onclick=()=>{const content='<!doctype html><html><head><meta charset="utf-8"><title>Invoice</title></head><body style="font-family:Arial,sans-serif;padding:30px">'+$('preview').innerHTML+'</body></html>',blob=new Blob([content],{type:'text/html'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='invoicepro-'+($('number').value||'document')+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};itemControls();render();
</script></body></html>
